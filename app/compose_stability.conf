// Classes the Compose compiler should treat as stable (F6.2).
//
// Each one is a data class with only `val` fields and is never changed after it is built: the
// listener and the settings repository always make a new instance. The compiler can't see that
// by itself because they hold a List, a Set, a Bitmap or a PendingIntent.
//
// Before adding a class here, check that nothing mutates it in place. A wrongly listed class
// makes the UI show stale data.

com.droidbubble.app.model.IslandSettings
com.droidbubble.app.model.MediaInfo
com.droidbubble.app.model.NotificationInfo
com.droidbubble.app.model.NotificationAction
com.droidbubble.app.model.ScreenRecordingState
com.droidbubble.app.model.ActiveCallState
